<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0b0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Clock">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>Work Hours Dashboard</title>
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div class="dash-shell">
        <header class="dash-header">
      <div>
        <div class="dash-logo">UBER<span class="slash">//</span>SHIFT</div>
        <div class="dash-subtitle">DASHBOARD</div>
      </div>
      <div class="header-actions">
        <button id="btnCopyClockLink" class="copy-link-btn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span id="copyLinkLabel">Copy Clock Link</span>
        </button>
        <div class="monthly-pill">
          <span class="pill-label">Monthly total</span>
          <span id="monthlyTotal" class="pill-value">0h 00m</span>
        </div>
      </div>
    </header>

    <div class="month-nav">
      <button id="btnPrevMonth" class="nav-btn" aria-label="Previous month">&larr;</button>
      <div id="monthYearLabel" class="month-year">Month Year</div>
      <button id="btnNextMonth" class="nav-btn" aria-label="Next month">&rarr;</button>
    </div>

    <div id="errorBanner" class="error-banner" style="display:none;"></div>

    <div class="calendar-wrapper">
      <div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>
      <div class="weekday-row">
        <div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>
      </div>
      <div id="calendarGrid" class="calendar-grid"></div>
    </div>

    <a href="clock.html" class="clock-link">Open Clock Page →</a>
  </div>

  <div id="editModal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3 id="modalDateLabel">Edit day</h3>
      <p class="modal-subtitle">Overwrite hours worked for this day.</p>
      <div class="modal-inputs">
        <div class="input-group">
          <label>Hours</label>
          <input type="number" id="editHours" min="0" max="24">
        </div>
        <div class="input-group">
          <label>Minutes</label>
          <input type="number" id="editMinutes" min="0" max="59">
        </div>
      </div>
      <div class="modal-actions">
        <button id="btnCancelEdit" class="btn-cancel">Cancel</button>
        <button id="btnSaveEdit" class="btn-save">Save</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
